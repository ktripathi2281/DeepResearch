# Minimal CI: unit tests + lint + frontend. No services required —
# PostgreSQL-dependent files skip cleanly without a database, and
# live-model tests skip without Ollama. No secrets are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check src tests
      - name: Ruff format check
        run: python -m ruff format --check src tests
      - name: Pytest (unit; PG/live tests skip without services)
        run: python -m pytest -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
